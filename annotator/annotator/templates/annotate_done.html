<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Klasyfikacja zakończona — Annotator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        --card-bg: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent: #7c6cff;
        --accent-hover: #9d8fff;
        --text-primary: #f0eeff;
        --text-secondary: rgba(255, 255, 255, 0.55);
        --success: #2dd4a8;
      }

      body {
        background: var(--bg-gradient);
        min-height: 100vh;
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }

      .navbar-custom {
        background: rgba(15, 12, 41, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--card-border);
      }

      .navbar-custom .navbar-brand {
        color: var(--text-primary);
        font-weight: 700;
        font-size: 1.3rem;
      }

      .navbar-custom .nav-link {
        color: var(--text-secondary);
        transition: color 0.2s;
      }

      .navbar-custom .nav-link:hover {
        color: var(--accent-hover);
      }

      .done-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 3rem;
        text-align: center;
        max-width: 500px;
        margin: auto;
      }

      .done-card .icon-done {
        font-size: 4rem;
        color: var(--success);
        margin-bottom: 1rem;
      }

      .done-card h2 {
        margin-bottom: 0.5rem;
      }

      .done-card p {
        color: var(--text-secondary);
        margin-bottom: 1.5rem;
      }

      .btn-back {
        background: var(--accent);
        border: none;
        color: #fff;
        border-radius: 12px;
        padding: 0.65rem 1.5rem;
        font-weight: 600;
        text-decoration: none;
        transition: all 0.2s;
        display: inline-block;
      }

      .btn-back:hover {
        background: var(--accent-hover);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="{% url 'datasets_list' %}">
          <i class="bi bi-journals me-2"></i>Annotator
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{% url 'datasets_list' %}">
            <i class="bi bi-grid-3x3-gap me-1"></i>Zestawy
          </a>
        </div>
      </div>
    </nav>

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
      <div class="done-card">
        <div class="icon-done"><i class="bi bi-check-circle-fill"></i></div>
        <h2>Wszystko sklasyfikowane!</h2>
        <p>
          {% if dataset %}
            Zestaw „{{ dataset.name }}" — {{ annotated }} / {{ total }} artykułów sklasyfikowanych.
          {% else %}
            Wszystkie artykuły zostały sklasyfikowane. Dziękujemy!
          {% endif %}
        </p>
        <a href="{% url 'datasets_list' %}" class="btn-back">
          <i class="bi bi-arrow-left me-1"></i>Wróć do zestawów
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
