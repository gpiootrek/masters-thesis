<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <title>Wgraj CSV — Annotator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        --card-bg: rgba(255, 255, 255, 0.06);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent: #7c6cff;
        --accent-hover: #9d8fff;
        --text-primary: #f0eeff;
        --text-secondary: rgba(255, 255, 255, 0.55);
      }

      body {
        background: var(--bg-gradient);
        min-height: 100vh;
        color: var(--text-primary);
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }

      .navbar-custom {
        background: rgba(15, 12, 41, 0.85);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--card-border);
      }

      .navbar-custom .navbar-brand {
        color: var(--text-primary);
        font-weight: 700;
        font-size: 1.3rem;
      }

      .navbar-custom .nav-link {
        color: var(--text-secondary);
        transition: color 0.2s;
      }

      .navbar-custom .nav-link:hover {
        color: var(--accent-hover);
      }

      .upload-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: 3rem;
        max-width: 520px;
        margin: auto;
      }

      .upload-card h2 {
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .upload-card p {
        color: var(--text-secondary);
        margin-bottom: 2rem;
      }

      .form-control {
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--card-border);
        color: var(--text-primary);
        border-radius: 10px;
        padding: 0.75rem 1rem;
      }

      .form-control:focus {
        background: rgba(255, 255, 255, 0.1);
        border-color: var(--accent);
        color: var(--text-primary);
        box-shadow: 0 0 0 3px rgba(124, 108, 255, 0.15);
      }

      .form-control::file-selector-button {
        background: var(--accent);
        border: none;
        color: #fff;
        border-radius: 8px;
        padding: 0.4rem 1rem;
        margin-right: 1rem;
        font-weight: 500;
        cursor: pointer;
      }

      .form-control::file-selector-button:hover {
        background: var(--accent-hover);
      }

      .btn-upload {
        background: var(--accent);
        border: none;
        color: #fff;
        border-radius: 12px;
        padding: 0.75rem 2rem;
        font-weight: 600;
        font-size: 1rem;
        width: 100%;
        transition: all 0.2s;
      }

      .btn-upload:hover {
        background: var(--accent-hover);
        color: #fff;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="{% url 'datasets_list' %}">
          <i class="bi bi-journals me-2"></i>Annotator
        </a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{% url 'datasets_list' %}">
            <i class="bi bi-grid-3x3-gap me-1"></i>Zestawy
          </a>
        </div>
      </div>
    </nav>

    <div class="container flex-grow-1 d-flex align-items-center justify-content-center">
      <div class="upload-card">
        <h2><i class="bi bi-cloud-upload me-2"></i>Wgraj plik CSV</h2>
        <p>Załaduj nowy zestaw danych z newsami do klasyfikacji.</p>
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          <div class="mb-3">
            <input type="file" name="csv_file" accept=".csv" required class="form-control" />
          </div>
          <button type="submit" class="btn-upload">
            <i class="bi bi-upload me-1"></i>Załaduj do bazy
          </button>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
